name: Verification only - ARN-91 tracking timeline
on:
  push:
    branches: [verify/arn91-timeline]
    paths: ['.github/workflows/arn91-timeline-proof.yml', '.github/arn91/**']
permissions:
  contents: read
jobs:
  proof:
    runs-on: windows-2025
    timeout-minutes: 18
    env:
      SOURCE: 2c861b253728120045762580b5af812d218c2bac
      TREE: 243c4d2602914b7651e684fa16863f66f06039f8
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: verification
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2c861b253728120045762580b5af812d218c2bac
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: '10.0.404'
      - name: Check pinned source and run controlled cases against native SQLite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $src = (Resolve-Path source).Path
          $verify = (Resolve-Path verification/.github/arn91).Path
          if ((git -C $src rev-parse HEAD) -cne $env:SOURCE -or (git -C $src rev-parse 'HEAD^{tree}') -cne $env:TREE -or (git -C $src status --porcelain)) { throw 'Product tree mismatch' }
          if ((git -C verification diff --name-only ac6b16b HEAD -- . ':(exclude).github/arn91/**' ':(exclude).github/workflows/arn91-timeline-proof.yml')) { throw 'Verifier includes product edits' }
          if (((git -C $src diff --name-only ac6b16b HEAD) -join ',') -cne 'Helpers/ChartHelper.cs,Services/WindowTrackingService.cs') { throw 'Unexpected product change' }
          "Verified source=$env:SOURCE tree=$env:TREE; Windows=$([Environment]::OSVersion.Version); image=$env:ImageVersion"
          dotnet new globaljson --sdk-version 10.0.404 --roll-forward disable
          [xml]$app = Get-Content -Raw "$src/ScreenTimeTracker.csproj"
          [xml]$test = Get-Content -Raw "$verify/Audit.csproj"
          $appPins = @($app.Project.ItemGroup.PackageReference | Where-Object Include -Match '^(Microsoft\.Data\.Sqlite|SQLite)' | ForEach-Object { "$($_.Include)=$($_.Version)" } | Sort-Object)
          $testPins = @($test.Project.ItemGroup.PackageReference | ForEach-Object { "$($_.Include)=$($_.Version)" } | Sort-Object)
          if (($appPins -join ',') -cne ($testPins -join ',')) { throw 'Product SQLite pins differ from audit' }
          "Audit SQLite pins: $($appPins -join ', ')"
          python "$verify/generate.py" $src
          dotnet build "$verify/Audit.csproj" -c Release -r win-x64 --self-contained false "-p:Screeny=$src"
          dotnet "$verify/bin/Release/net10.0/win-x64/Audit.dll"
          dotnet test "$verify/chart/ScreenTimeTracker.Tests.csproj" -r win-x64 "-p:Screeny=$src" --filter "FullyQualifiedName~ExactMidnightBoundary|FullyQualifiedName~ArbitraryOvernightRows" --logger "console;verbosity=normal"
      - name: Build pinned WinUI solution x64
        if: success() || failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location source
          dotnet build ScreenTimeTracker.sln -p:Platform=x64 -p:GenerateAppxPackageOnBuild=false -p:AppxPackageSigningEnabled=false
      - name: Exercise real Windows input idle and programmatic foreground
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $native = (Resolve-Path verification/.github/arn91/native).Path
          $sql = (Resolve-Path verification/.github/arn91/bin/Release/net10.0/win-x64/Audit.dll).Path
          $app = (Resolve-Path source/bin/x64/Debug/net10.0-windows10.0.22621.0/win-x64/Screeny.exe).Path
          $csc = "$env:SystemRoot/Microsoft.NET/Framework64/v4.0.30319/csc.exe"
          & $csc /nologo /target:winexe /platform:x64 "/out:$env:RUNNER_TEMP/ScreenyTimelineAlpha.exe" /r:System.Windows.Forms.dll /r:System.Drawing.dll "$native/Synthetic.cs"
          Copy-Item "$env:RUNNER_TEMP/ScreenyTimelineAlpha.exe" "$env:RUNNER_TEMP/ScreenyTimelineBravo.exe"
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -Mta -File "$native/run.ps1" -Exe $app -SqlApp $sql
